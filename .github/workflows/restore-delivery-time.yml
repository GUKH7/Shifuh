name: Restaurar prazo de entrega

on:
  push:
    paths:
      - .github/workflows/restore-delivery-time.yml

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar prazo sem exibir distância
        run: |
          python - <<'PY'
          from pathlib import Path

          calculator_path = Path('src/features/storefront/DeliveryCalculator.tsx')
          calculator = calculator_path.read_text()
          replacements = [
              (
                  'Informe o endereço completo para consultar a taxa de entrega antes do pagamento.',
                  'Informe o endereço completo para consultar a taxa e o prazo antes do pagamento.',
              ),
              (
                  '<p>A taxa é calculada automaticamente conforme o endereço informado.</p>',
                  '<p>A taxa e o prazo são calculados automaticamente conforme o endereço informado.</p>',
              ),
              (
                  'canCalculate ? "Calcular taxa de entrega" : "Complete o endereço"',
                  'canCalculate ? "Calcular taxa e prazo" : "Complete o endereço"',
              ),
              (
                  '<p className="text-sm font-black leading-5 text-emerald-800 sm:text-base">Taxa de entrega</p>',
                  '<p className="text-sm font-black leading-5 text-emerald-800 sm:text-base">Taxa e prazo estimados</p>\n              <p className="mt-1 text-xs leading-4 text-emerald-700 sm:text-sm">Previsão de {deliveryInfo.time} min</p>',
              ),
              (
                  '<p className="font-black text-amber-900">Taxa de entrega estimada</p>',
                  '<p className="font-black text-amber-900">Taxa e prazo estimados</p>',
              ),
              (
                  '''              <p className="font-black text-amber-900">
                {deliveryInfo.price === 0 ? "Grátis" : formatMoney(deliveryInfo.price)}
              </p>
              
''',
                  '''              <p className="font-black text-amber-900">
                {deliveryInfo.price === 0 ? "Grátis" : formatMoney(deliveryInfo.price)}
              </p>
              <p className="mt-1 text-sm text-amber-800">Previsão de {deliveryInfo.time} min</p>
''',
              ),
          ]

          for old, new in replacements:
              if old not in calculator:
                  raise SystemExit(f'Trecho não encontrado em DeliveryCalculator.tsx: {old[:90]!r}')
              calculator = calculator.replace(old, new, 1)

          if 'deliveryInfo.distance' in calculator:
              raise SystemExit('A distância voltou a aparecer no DeliveryCalculator.tsx.')

          calculator_path.write_text(calculator)

          drawer_path = Path('src/features/storefront/CheckoutDrawer.tsx')
          drawer = drawer_path.read_text()
          drawer_replacements = [
              (
                  'Calcule a taxa de entrega antes de continuar.',
                  'Calcule a taxa e o prazo da entrega antes de continuar.',
              ),
              (
                  'Taxa de entrega: {formatMoney(feeValue)}',
                  'Taxa de entrega: {formatMoney(feeValue)} · Prazo: {deliveryInfo.time} min',
              ),
              (
                  '`Taxa de entrega: ${formatMoney(feeValue)}`',
                  '`Taxa de entrega: ${formatMoney(feeValue)} · Prazo: ${deliveryInfo?.time} min`',
              ),
              (
                  '<p className="mt-2 text-xs font-bold text-emerald-700">Taxa de entrega: {completedOrder.deliveryFee === 0 ? "Grátis" : formatMoney(completedOrder.deliveryFee)}</p>',
                  '<p className="mt-2 text-xs font-bold text-emerald-700">Taxa de entrega: {completedOrder.deliveryFee === 0 ? "Grátis" : formatMoney(completedOrder.deliveryFee)} · Prazo aproximado: {completedOrder.deliveryTime} min</p>',
              ),
              (
                  'Preencha o endereço e use “Calcular taxa de entrega” acima.',
                  'Preencha o endereço e use “Calcular taxa e prazo” acima.',
              ),
          ]

          for old, new in drawer_replacements:
              if old not in drawer:
                  raise SystemExit(f'Trecho não encontrado em CheckoutDrawer.tsx: {old[:90]!r}')
              drawer = drawer.replace(old, new, 1)

          if 'deliveryInfo.distance' in drawer or 'deliveryDistance' in drawer:
              raise SystemExit('A distância voltou a aparecer no CheckoutDrawer.tsx.')

          drawer_path.write_text(drawer)

          page_path = Path('src/app/[slug]/page.tsx')
          page = page_path.read_text()
          old = 'Calcule novamente a taxa de entrega para continuar.'
          new = 'Calcule novamente a taxa e o prazo para continuar.'
          if old not in page:
              raise SystemExit('Trecho não encontrado em page.tsx.')
          page_path.write_text(page.replace(old, new, 1))
          PY

      - name: Commitar alteração
        run: |
          git config user.name "Gestor Delivery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-delivery-time.yml
          git add src/features/storefront/DeliveryCalculator.tsx src/features/storefront/CheckoutDrawer.tsx 'src/app/[slug]/page.tsx'
          git commit -m "fix(delivery): mantém prazo e oculta distância"
          git push
