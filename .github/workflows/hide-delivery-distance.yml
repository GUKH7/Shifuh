name: Ocultar distância da entrega

on:
  push:
    paths:
      - .github/workflows/hide-delivery-distance.yml

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remover distância visível do checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          calculator_path = Path('src/features/storefront/DeliveryCalculator.tsx')
          calculator = calculator_path.read_text()

          calculator = calculator.replace(
              '<p>A distância é calculada pelo trajeto viário entre a loja e o endereço informado.</p>',
              '<p>A taxa é calculada automaticamente conforme o endereço informado.</p>',
          )

          calculator, count = re.subn(
              r'<p className="text-sm font-black leading-5 text-emerald-800 sm:text-base">Taxa e prazo estimados</p>\s*<p className="mt-1 text-xs leading-4 text-emerald-700 sm:text-sm">.*?</p>',
              '<p className="text-sm font-black leading-5 text-emerald-800 sm:text-base">Taxa de entrega</p>',
              calculator,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Não foi possível atualizar o card principal da taxa.')

          calculator, count = re.subn(
              r'(<p className="whitespace-nowrap text-base font-black leading-5 text-emerald-800 sm:text-lg">\s*\{deliveryInfo\.price === 0 \? "Grátis" : formatMoney\(deliveryInfo\.price\)\}\s*</p>)\s*<p className="mt-1 whitespace-nowrap text-xs leading-4 text-emerald-700 sm:text-sm">.*?</p>',
              r'\1',
              calculator,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Não foi possível remover o prazo do card principal.')

          calculator = calculator.replace(
              '<p className="font-black text-amber-900">Estimativa pelo CEP</p>',
              '<p className="font-black text-amber-900">Taxa de entrega estimada</p>',
          )
          calculator = calculator.replace(
              'Aproximadamente {deliveryInfo.distance} km. Complete o endereço para validar a entrega.',
              'Complete o endereço para confirmar o valor da entrega.',
          )
          calculator = calculator.replace(
              '<p className="mt-1 text-sm text-amber-800">{deliveryInfo.time} min</p>',
              '',
          )
          calculator = calculator.replace(
              'A distância aproximada é de {deliveryInfo.distance} km, além do limite atendido pela loja.',
              'O endereço informado está além do limite atendido pela loja.',
          )
          calculator_path.write_text(calculator)

          drawer_path = Path('src/features/storefront/CheckoutDrawer.tsx')
          drawer = drawer_path.read_text()
          drawer = drawer.replace(
              '{deliveryInfo.distance} km aproximadamente · previsão de {deliveryInfo.time} min',
              'Taxa de entrega: {formatMoney(feeValue)}',
          )
          drawer = drawer.replace(
              '`Previsão de ${deliveryInfo?.time} min · ${deliveryInfo?.distance} km aprox.`',
              '`Taxa de entrega: ${formatMoney(feeValue)}`',
          )

          if 'deliveryInfo.distance' in drawer:
              raise SystemExit('Ainda existe distância visível em CheckoutDrawer.tsx.')

          drawer_path.write_text(drawer)
          PY

      - name: Commitar alteração
        run: |
          git config user.name "Gestor Delivery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hide-delivery-distance.yml
          git add src/features/storefront/DeliveryCalculator.tsx src/features/storefront/CheckoutDrawer.tsx
          git commit -m "fix(delivery): oculta distância do cliente"
          git push
