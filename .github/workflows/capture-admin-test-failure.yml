name: Capture admin test failure summary

on:
  push:
    branches:
      - fix/admin-visual-alignment-round

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Capture focused failure summary
        run: |
          set +e
          npm test > full-test-output.txt 2>&1
          status=$?
          grep -n -B 8 -A 18 -E '^not ok|ERR_ASSERTION|at TestContext|failureType|error:' full-test-output.txt > admin-test-failure-summary.txt || true
          echo "TEST_EXIT_CODE=$status" >> admin-test-failure-summary.txt
          rm full-test-output.txt
          rm .github/workflows/capture-admin-test-failure.yml
      - name: Commit diagnostic summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Registrar resumo temporário da falha de testes"
          git push origin HEAD:fix/admin-visual-alignment-round
