name: P0 Distributed Rate Limit V3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-distributed-rate-limit-v3.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unrelated legacy harness from P0 validation
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/p0-distributed-rate-limit-v2.yml")
          text = path.read_text(encoding="utf-8")
          old = "node --test --test-concurrency=1 tests/distributed-rate-limit.test.js tests/api-orders.test.js tests/admin-login-server-route.test.js"
          new = "node --test --test-concurrency=1 tests/distributed-rate-limit.test.js tests/admin-login-server-route.test.js"
          if old not in text:
              raise SystemExit("Validation command not found")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Trigger corrected implementation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/p0-distributed-rate-limit-v2.yml
          git rm .github/workflows/p0-distributed-rate-limit-v3.yml
          git commit -m "chore(security): valida rate limit isoladamente"
          git push origin HEAD:main
