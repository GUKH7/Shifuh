name: Patch history payment labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-history-payment-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Padronizar nomes dos métodos de pagamento
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/admin/(painel)/history/HistoryWorkspace.tsx')
          content = path.read_text(encoding='utf-8')
          content = content.replace('CREDIT: "CRÉDITO"', 'CREDIT: "Crédito"')
          content = content.replace('CREDIT_CARD: "CRÉDITO"', 'CREDIT_CARD: "Crédito"')
          content = content.replace('CARD_CREDIT: "CRÉDITO"', 'CARD_CREDIT: "Crédito"')
          content = content.replace('DEBIT: "DÉBITO"', 'DEBIT: "Débito"')
          content = content.replace('DEBIT_CARD: "DÉBITO"', 'DEBIT_CARD: "Débito"')
          content = content.replace('CARD_DEBIT: "DÉBITO"', 'CARD_DEBIT: "Débito"')
          path.write_text(content, encoding='utf-8')
          PY

      - name: Commitar correção
        run: |
          git config user.name "GUKH7"
          git config user.email "keiohirakawa@gmail.com"
          git rm .github/workflows/patch-history-payment-labels.yml
          git add 'src/app/admin/(painel)/history/HistoryWorkspace.tsx'
          git commit -m "style(history): padroniza métodos de pagamento"
          git push origin main
