name: Patch history payment labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-history-payment-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Padronizar nomes dos métodos de pagamento
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/admin/(painel)/history/HistoryWorkspace.tsx')
          content = path.read_text(encoding='utf-8')

          replacements = {
              'CREDIT: "CRÉDITO"': 'CREDIT: "Crédito"',
              'CREDIT_CARD: "CRÉDITO"': 'CREDIT_CARD: "Crédito"',
              'CARD_CREDIT: "CRÉDITO"': 'CARD_CREDIT: "Crédito"',
              'DEBIT: "DÉBITO"': 'DEBIT: "Débito"',
              'DEBIT_CARD: "DÉBITO"': 'DEBIT_CARD: "Débito"',
              'CARD_DEBIT: "DÉBITO"': 'CARD_DEBIT: "Débito"',
          }

          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'Trecho esperado não encontrado: {old}')
              content = content.replace(old, new)

          path.write_text(content, encoding='utf-8')
          PY

      - name: Commitar correção e remover workflow temporário
        run: |
          git config user.name "GUKH7"
          git config user.email "keiohirakawa@gmail.com"
          git rm .github/workflows/patch-history-payment-labels.yml
          git add 'src/app/admin/(painel)/history/HistoryWorkspace.tsx'
          git commit -m "style(history): padroniza métodos de pagamento"
          git push origin main
