name: Apply history live fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-history-live-fix.yml'

permissions:
  contents: write

jobs:
  patch-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Allow independent date expansion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/admin/(painel)/history/HistoryWorkspace.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  const [expandedDateKey, setExpandedDateKey] = useState<string | null>(null);',
                  '  const [expandedDateKeys, setExpandedDateKeys] = useState<Set<string>>(() => new Set());',
              ),
              (
                  '    setExpandedDateKey(latestGroupKey);',
                  '    setExpandedDateKeys(latestGroupKey ? new Set([latestGroupKey]) : new Set());',
              ),
              (
                  '''  const toggleDateGroup = (key: string) => {\n    setExpandedDateKey((current) => (current === key ? null : key));\n  };''',
                  '''  const toggleDateGroup = (key: string) => {\n    setExpandedDateKeys((current) => {\n      const next = new Set(current);\n      if (next.has(key)) {\n        next.delete(key);\n      } else {\n        next.add(key);\n      }\n      return next;\n    });\n  };''',
              ),
              (
                  '              const isCollapsed = expandedDateKey !== group.key;',
                  '              const isCollapsed = !expandedDateKeys.has(group.key);',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected pattern not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/admin/(painel)/history/HistoryWorkspace.tsx'
          git commit -m 'fix(history): mantém várias datas expandidas'
          git push origin main
