name: Apply orders date filters

on:
  push:
    branches:
      - agent/orders-date-filters
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-orders-date-filters
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[orders-filters-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ORDER_TRACKING_SECRET: ci-placeholder-order-tracking-secret-with-32-characters
      WHATSAPP_BOT_API_URL: http://127.0.0.1:3001
      WHATSAPP_BOT_API_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/orders-date-filters
          fetch-depth: 0

      - name: Apply source changes
        run: |
          if [ -f tests/orders-date-filters.test.js ]; then
            echo "Orders filters changes already applied."
            exit 0
          fi
          python3 scripts/apply-orders-date-filters.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/admin/(painel)/orders/page.tsx" tests/orders-date-filters.test.js
          git commit -m "feat: tornar data e filtros de pedidos funcionais [orders-filters-applied]"
          git push origin HEAD:agent/orders-date-filters

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit service role usage
        run: npm run audit:service-role

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
