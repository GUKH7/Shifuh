name: Temporary priority one patch

on:
  push:
    branches:
      - fix/priority-1-operational-trust
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/priority-1-operational-trust
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize patch script
        run: python .github/scripts/fix-priority-one-script.py

      - name: Apply operational trust patch
        run: python .github/scripts/apply-priority-one.py

      - name: Remove temporary patch files
        run: rm -f .github/scripts/apply-priority-one.py .github/scripts/fix-priority-one-script.py .github/scripts/trigger-priority-one.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Corrigir erros operacionais de prioridade 1"
            git push origin HEAD:fix/priority-1-operational-trust
          fi
