name: Atualizar package-lock Shifuh

on:
  push:
    branches:
      - chore/finalize-shifuh-technical-identity

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/finalize-shifuh-technical-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerar metadados do lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validar identidade do package
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.name!=='shifuh'||l.name!=='shifuh'||l.packages?.['']?.name!=='shifuh') process.exit(1)"

      - name: Persistir package-lock atualizado
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock já está sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincronizar package-lock com Shifuh [skip ci]"
          git push origin HEAD:chore/finalize-shifuh-technical-identity
