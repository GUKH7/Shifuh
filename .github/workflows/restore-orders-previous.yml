name: Restore previous orders page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    # Este fluxo é temporário e se remove após restaurar somente a página de Pedidos.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore orders page
        run: |
          git checkout 74372b5f725474e247531d6197a7eb97a028f63b -- 'src/app/admin/(painel)/orders/page.tsx'
          git rm '.github/workflows/restore-orders-previous.yml'

      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/admin/(painel)/orders/page.tsx'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'revert(orders): restaura visual anterior da página'
          git push
