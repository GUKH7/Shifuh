name: Apply orders auto refresh

on:
  push:
    branches:
      - fix/orders-auto-refresh

permissions:
  contents: write

concurrency:
  group: apply-orders-auto-refresh
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[orders-auto-refresh-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ORDER_TRACKING_SECRET: ci-placeholder-order-tracking-secret-with-32-characters
      WHATSAPP_BOT_API_URL: http://127.0.0.1:3001
      WHATSAPP_BOT_API_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/orders-auto-refresh
          fetch-depth: 0

      - name: Apply source changes
        run: python3 scripts/apply-orders-auto-refresh.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate project
        run: npm run validate

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/admin/(painel)/orders/page.tsx" tests/orders-auto-refresh.test.js
          git commit -m "fix: estabilizar atualização automática dos pedidos [orders-auto-refresh-applied]"
          git push origin HEAD:fix/orders-auto-refresh
