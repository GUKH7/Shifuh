name: Bootstrap Sentry lockfile

on:
  push:
    branches:
      - p2-external-observability
    paths:
      - .github/workflows/bootstrap-sentry-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p2-external-observability

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pinned Sentry SDK
        run: npm install --save-exact @sentry/nextjs@10.70.0

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(obs): add pinned Sentry SDK"
          git push origin HEAD:p2-external-observability
