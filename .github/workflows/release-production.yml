name: Production release (explicit)

# Deliberately separate from CI. Running CI cannot reach the production job.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Type the exact 40-character main commit SHA to release"
        type: string
        required: true
      confirmation:
        description: "Type PUBLICAR-SHIFUH-PRODUCAO to approve publication"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-release-workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify deliberate release authorization
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit confirmation and exact current SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA"; exit 1; }
          test "$CONFIRMATION" = "PUBLICAR-SHIFUH-PRODUCAO" || { echo "Release confirmation missing"; exit 1; }
          test "$REQUESTED_SHA" = "$RUN_SHA" || { echo "Release SHA differs from selected main revision"; exit 1; }

  gates:
    name: Validate exact selected commit before release
    needs: authorize
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy-production:
    name: Deploy production (gated)
    needs:
      - authorize
      - gates
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.authorize.result == 'success' &&
      needs.gates.result == 'success' &&
      inputs.commit_sha == github.sha &&
      inputs.confirmation == 'PUBLICAR-SHIFUH-PRODUCAO'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: shifuh-production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CI_GATE_RESULT: ${{ needs.gates.result }}
      DEPLOY_PRODUCTION_APPROVED: "true"
      RELEASE_EXPECTED_SHA: ${{ inputs.commit_sha }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 64.5.0

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify release context
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          export REMOTE_SHA
          node scripts/verify-release-context.cjs

      - name: Check Vercel credentials are configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub variable VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub variable VERCEL_PROJECT_ID"; exit 1; }
          test -n "${VERCEL_TOKEN:-}" || { echo "Missing GitHub secret VERCEL_TOKEN"; exit 1; }

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Fetch Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build deployment with production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Recheck main and deploy validated build
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          export REMOTE_SHA
          node scripts/verify-release-context.cjs
          vercel deploy --prebuilt --prod --yes
