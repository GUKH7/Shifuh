name: CI

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Authorize production deployment after all gates pass"
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true && 'manual-production' || 'checks' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true) }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ORDER_TRACKING_SECRET: ci-placeholder-order-tracking-secret-with-32-characters
      WHATSAPP_BOT_API_URL: http://127.0.0.1:3001
      WHATSAPP_BOT_API_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit service role usage
        id: service-role-audit
        continue-on-error: true
        run: npm run audit:service-role

      - name: Test
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test-output.log

      - name: Upload unit test diagnostics
        if: steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: unit-test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Validation gate
        if: always()
        env:
          AUDIT_RESULT: ${{ steps.service-role-audit.outcome }}
          TEST_RESULT: ${{ steps.unit-tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          echo "audit=${AUDIT_RESULT}"
          echo "test=${TEST_RESULT}"
          echo "lint=${LINT_RESULT}"
          echo "typecheck=${TYPECHECK_RESULT}"
          echo "build=${BUILD_RESULT}"
          test "${AUDIT_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
          test "${LINT_RESULT}" = "success"
          test "${TYPECHECK_RESULT}" = "success"
          test "${BUILD_RESULT}" = "success"

  commercial-e2e:
    name: Commercial E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the latest stable release used by this CI instead of resolving
          # `latest` through GitHub's API on every run, which can hit rate limits.
          version: 2.116.0

      - name: Initialize local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start isolated Supabase
        run: |
          supabase start
          supabase db reset

      - name: Export isolated Supabase environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "ORDER_TRACKING_SECRET=e2e-order-tracking-secret-shifuh-2026"
            echo "RATE_LIMIT_HASH_SECRET=e2e-rate-limit-secret-shifuh-2026"
            echo "WHATSAPP_BOT_API_URL=http://127.0.0.1:3001"
            echo "WHATSAPP_BOT_API_TOKEN=e2e-whatsapp-placeholder-token"
            echo "E2E_ADMIN_EMAIL=e2e-owner@shifuh.test"
            echo "E2E_ADMIN_PASSWORD=Shifuh-E2E-2026!"
          } >> "$GITHUB_ENV"

      - name: Seed commercial fixture
        run: node scripts/e2e-seed.mjs

      - name: Verify iFood event leases against isolated Postgres
        run: IFOOD_LEASE_E2E=1 node scripts/test-ifood-event-leases.mjs

      - name: Homologate iFood replay outages, ACK batches and idempotency in isolated Supabase
        env:
          IFOOD_REPLAY_HOMOLOGATION: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "true"
        run: node scripts/ifood-replay-homologation.cjs

      - name: Validate iFood worker crash, restart, ACK recovery and same-order races
        env:
          IFOOD_REPLAY_RESTART_E2E: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "true"
        run: node scripts/ifood-worker-restart-homologation.cjs

      - name: Validate iFood ACK ambiguity and out-of-order statuses on local Postgres
        env:
          IFOOD_ACK_STATUS_E2E: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "true"
        run: node scripts/ifood-ack-status-homologation.cjs

      - name: Validate iFood distributed ACK leases with independent Node workers
        env:
          IFOOD_ACK_MULTIWORKER_E2E: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "true"
        run: node scripts/ifood-ack-multiworker-homologation.cjs

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          # Playwright downloads its own Chromium. The preconfigured Google Chrome
          # APT source on hosted runners is unrelated and can transiently publish
          # mismatched Release/Packages metadata, blocking `--with-deps` entirely.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Run commercial E2E
        run: npm run test:e2e:commercial

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - commercial-e2e

    steps:
      - name: Require validation and commercial E2E
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          COMMERCIAL_E2E_RESULT: ${{ needs.commercial-e2e.result }}
        run: |
          echo "validate=${VALIDATE_RESULT}"
          echo "commercial-e2e=${COMMERCIAL_E2E_RESULT}"
          test "${VALIDATE_RESULT}" = "success"
          test "${COMMERCIAL_E2E_RESULT}" = "success"

  # Production deployments require explicit workflow_dispatch approval and green gates.
  # Git auto-deploy of main is disabled independently in vercel.json.
  deploy-production:
    name: Deploy production (gated)
    needs: release-gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy_production == true &&
      needs.release-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: shifuh-production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CI_GATE_RESULT: ${{ needs.release-gate.result }}
      DEPLOY_PRODUCTION_APPROVED: ${{ inputs.deploy_production }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 64.5.0

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify release context
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          export REMOTE_SHA
          node scripts/verify-release-context.cjs

      - name: Check Vercel credentials are configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub variable VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub variable VERCEL_PROJECT_ID"; exit 1; }
          test -n "${VERCEL_TOKEN:-}" || { echo "Missing GitHub secret VERCEL_TOKEN"; exit 1; }

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Fetch Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build deployment with production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Recheck main and deploy validated build
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          export REMOTE_SHA
          node scripts/verify-release-context.cjs
          vercel deploy --prebuilt --prod --yes
