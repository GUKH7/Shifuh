name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ORDER_TRACKING_SECRET: ci-placeholder-order-tracking-secret-with-32-characters
      WHATSAPP_BOT_API_URL: http://127.0.0.1:3001
      WHATSAPP_BOT_API_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit service role usage
        run: npm run audit:service-role

      - name: Test
        shell: bash
        run: |
          set +e
          npm test > /tmp/test-output.log 2>&1
          status=$?
          tail -n 180 /tmp/test-output.log
          exit $status

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
