name: CI

on:
  # Every manual CI run is validation-only; there is no deployment input or job.
  workflow_dispatch:
  # Reuse the same three gates for separately authorized releases.
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Separate release calls from regular CI runs; never cancel a different workflow.
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ORDER_TRACKING_SECRET: ci-placeholder-order-tracking-secret-with-32-characters
      WHATSAPP_BOT_API_URL: http://127.0.0.1:3001
      WHATSAPP_BOT_API_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit service role usage
        id: service-role-audit
        continue-on-error: true
        run: npm run audit:service-role

      - name: Test
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test-output.log

      - name: Upload unit test diagnostics
        if: steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: unit-test-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Validation gate
        if: always()
        env:
          AUDIT_RESULT: ${{ steps.service-role-audit.outcome }}
          TEST_RESULT: ${{ steps.unit-tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          echo "audit=${AUDIT_RESULT}"
          echo "test=${TEST_RESULT}"
          echo "lint=${LINT_RESULT}"
          echo "typecheck=${TYPECHECK_RESULT}"
          echo "build=${BUILD_RESULT}"
          test "${AUDIT_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
          test "${LINT_RESULT}" = "success"
          test "${TYPECHECK_RESULT}" = "success"
          test "${BUILD_RESULT}" = "success"

  commercial-e2e:
    name: Commercial E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the latest stable release used by this CI instead of resolving
          # `latest` through GitHub's API on every run, which can hit rate limits.
          version: 2.116.0

      - name: Initialize local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Materialize pending iFood merchant migration (local CI only)
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new ifood_merchant_uniqueness
          migration="$(find supabase/migrations -maxdepth 1 -name '*_ifood_merchant_uniqueness.sql' -print)"
          test -f "$migration"
          cp docs/operations/ifood-merchant-uniqueness.pending.sql "$migration"
          mkdir -p generated-migrations
          cp "$migration" generated-migrations/

      - name: Upload generated local migration for review
        uses: actions/upload-artifact@v4
        with:
          name: ifood-merchant-uniqueness-migration
          path: generated-migrations/*.sql
          if-no-files-found: error
          retention-days: 7

      - name: Start isolated Supabase
        run: |
          supabase start
          supabase db reset

      - name: Export isolated Supabase environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "ORDER_TRACKING_SECRET=e2e-order-tracking-secret-shifuh-2026"
            echo "RATE_LIMIT_HASH_SECRET=e2e-rate-limit-secret-shifuh-2026"
            echo "WHATSAPP_BOT_API_URL=http://127.0.0.1:3001"
            echo "WHATSAPP_BOT_API_TOKEN=e2e-whatsapp-placeholder-token"
            echo "E2E_ADMIN_EMAIL=e2e-owner@shifuh.test"
            echo "E2E_ADMIN_PASSWORD=Shifuh-E2E-2026!"
          } >> "$GITHUB_ENV"

      - name: Seed commercial fixture
        run: node scripts/e2e-seed.mjs

      - name: Verify concurrent iFood merchant claims against isolated Postgres
        run: IFOOD_MERCHANT_UNIQUENESS_E2E=1 node scripts/test-ifood-merchant-uniqueness.mjs

      - name: Verify iFood event leases against isolated Postgres
        run: IFOOD_LEASE_E2E=1 node scripts/test-ifood-event-leases.mjs

      - name: Homologate iFood replay outages, ACK batches and idempotency in isolated Supabase
        env:
          IFOOD_REPLAY_HOMOLOGATION: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "true"
        run: node scripts/ifood-replay-homologation.cjs

      - name: Validate iFood worker crash, restart, ACK recovery and same-order races
        env:
          IFOOD_REPLAY_RESTART_E2E: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "true"
        run: node scripts/ifood-worker-restart-homologation.cjs

      - name: Validate iFood ACK ambiguity and out-of-order statuses on local Postgres
        env:
          IFOOD_ACK_STATUS_E2E: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "true"
        run: node scripts/ifood-ack-status-homologation.cjs

      - name: Validate iFood distributed ACK leases with independent Node workers
        env:
          IFOOD_ACK_MULTIWORKER_E2E: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "true"
        run: node scripts/ifood-ack-multiworker-homologation.cjs

      - name: Validate legacy iFood ACK leases, ambiguous SQL and deadline on local Postgres
        env:
          IFOOD_LEGACY_ACK_E2E: "1"
          IFOOD_PERSISTED_REPLAY_ENABLED: "false"
        run: node scripts/ifood-legacy-ack-homologation.cjs

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          # Playwright downloads its own Chromium. The preconfigured Google Chrome
          # APT source on hosted runners is unrelated and can transiently publish
          # mismatched Release/Packages metadata, blocking `--with-deps` entirely.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install chromium

      - name: Run commercial E2E
        run: npm run test:e2e:commercial

      - name: Validate unavailable products are hidden on public desktop and mobile
        run: NEXT_DIST_DIR=.next-e2e npx playwright test tests/e2e/storefront-paused-visibility.spec.ts --project=desktop-chrome --project=mobile-chrome --workers=1

      - name: Validate persisted cart and mobile purchase flow on isolated fixture
        run: NEXT_DIST_DIR=.next-e2e npx playwright test tests/e2e/storefront-mobile-purchase.spec.ts --project=mobile-chrome --workers=1

      - name: Validate orders quick queue on mobile with isolated local Supabase
        run: NEXT_DIST_DIR=.next-e2e npx playwright test tests/e2e/orders-mobile-quick-queue.spec.ts --project=mobile-chrome --workers=1

      - name: Validate manual loyalty points against isolated local Supabase
        env:
          MANUAL_LOYALTY_LOCAL_E2E: "1"
        run: node scripts/manual-loyalty-credit-homologation.mjs

      - name: Validate manual credit mobile confirmation
        run: NEXT_DIST_DIR=.next-e2e npx playwright test tests/e2e/manual-credit-mobile.spec.ts --project=mobile-chrome --workers=1

      - name: Validate quick customer registration using isolated local Supabase
        env:
          MANUAL_CUSTOMER_LOCAL_E2E: "1"
        run: node scripts/manual-customer-registration-homologation.mjs

      - name: Validate quick customer registration on mobile
        run: NEXT_DIST_DIR=.next-e2e npx playwright test tests/e2e/manual-customer-registration.spec.ts --project=mobile-chrome --workers=1

      - name: Validate Central de Clientes mobile segments and loyalty
        run: NEXT_DIST_DIR=.next-e2e npx playwright test tests/e2e/customer-hub-mobile.spec.ts --project=mobile-chrome --workers=1

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - commercial-e2e

    steps:
      - name: Require validation and commercial E2E
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          COMMERCIAL_E2E_RESULT: ${{ needs.commercial-e2e.result }}
        run: |
          echo "validate=${VALIDATE_RESULT}"
          echo "commercial-e2e=${COMMERCIAL_E2E_RESULT}"
          test "${VALIDATE_RESULT}" = "success"
          test "${COMMERCIAL_E2E_RESULT}" = "success"
