name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/orders-auto-refresh

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ORDER_TRACKING_SECRET: ci-placeholder-order-tracking-secret-with-32-characters
      WHATSAPP_BOT_API_URL: http://127.0.0.1:3001
      WHATSAPP_BOT_API_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/orders-auto-refresh
          fetch-depth: 0

      - name: Apply source correction
        run: |
          if grep -q 'const supabase = useMemo' "src/app/admin/(painel)/orders/page.tsx"; then
            echo "Correction already applied"
          else
            python3 scripts/apply-orders-auto-refresh.py
          fi

      - name: Commit source correction
        run: |
          if git diff --quiet; then
            echo "No generated changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "src/app/admin/(painel)/orders/page.tsx" tests/orders-auto-refresh.test.js
            git commit -m "fix: estabilizar atualização automática dos pedidos [orders-auto-refresh-applied]"
            git push origin HEAD:fix/orders-auto-refresh
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit service role usage
        run: npm run audit:service-role

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
