name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ORDER_TRACKING_SECRET: ci-placeholder-order-tracking-secret-with-32-characters
      WHATSAPP_BOT_API_URL: http://127.0.0.1:3001
      WHATSAPP_BOT_API_TOKEN: ci-placeholder-token

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:service-role
      - name: Full test diagnostic
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Publish full test diagnostic
        if: ${{ steps.tests.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Diagnóstico temporário da suíte completa"
            echo
            echo '```text'
            tail -n 70 test-output.txt
            echo '```'
          } > test-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file test-comment.md
      - name: Enforce tests
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1
