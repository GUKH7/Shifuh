name: WhatsApp Oracle Security

on:
  push:
    paths:
      - "ops/oracle/whatsapp-api/**"
      - ".github/workflows/whatsapp-oracle-security.yml"
  pull_request:
    paths:
      - "ops/oracle/whatsapp-api/**"
      - ".github/workflows/whatsapp-oracle-security.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/oracle/whatsapp-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ops/oracle/whatsapp-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run WhatsApp security tests
        run: npm test
