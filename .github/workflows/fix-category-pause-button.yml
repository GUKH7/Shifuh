name: Fix category pause button

on:
  push:
    branches:
      - feature/pause-category

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pause-category
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-category-pause-button.py
      - run: |
          rm scripts/fix-category-pause-button.py
          rm .github/workflows/fix-category-pause-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show category pause action"
          git push origin HEAD:feature/pause-category
