name: Aplicar rota viária

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-road-distance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrar cotação por rota
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              content = file.read_text()
              if content.count(old) != 1:
                  raise SystemExit(f"Esperava uma ocorrência em {path}: {old[:80]!r}; encontrei {content.count(old)}")
              file.write_text(content.replace(old, new, 1))

          storefront_path = Path("src/app/[slug]/page.tsx")
          storefront = storefront_path.read_text()
          storefront = storefront.replace(
              'import { calculateDistance, calculateDeliveryFee, getCoordinates } from "@/lib/geo";\n',
              '',
              1,
          )
          storefront = storefront.replace('    restoCoords,\n', '', 1)

          delivery_function = '''  const calculateDeliveryForAddress = async (addressData: typeof EMPTY_ADDRESS) => {
            if (!isCompleteCheckoutAddress(addressData)) {
              setDeliveryInfo(null);
              setDeliveryError("Complete CEP, rua, número, bairro, cidade e UF para calcular a entrega.");
              return;
            }
            if (!restaurant?.id) {
              setDeliveryInfo(null);
              setDeliveryError("A loja não conseguiu calcular a entrega agora. Tente novamente em instantes.");
              return;
            }

            setCalculatingFee(true);
            setDeliveryError("");

            try {
              const response = await fetch("/api/storefront/delivery-quote", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ restaurantId: restaurant.id, address: addressData }),
              });
              const result = await response.json().catch(() => ({}));

              if (!response.ok) {
                setDeliveryInfo(null);
                trackError(
                  typeof result.code === "string"
                    ? result.code.toLowerCase()
                    : "delivery_quote_failed",
                );
                setDeliveryError(
                  result.error || "Não foi possível calcular a rota de entrega agora. Tente novamente.",
                );
                return;
              }

              setDeliveryInfo({
                price: Number(result.price) || 0,
                time: Number(result.time) || 0,
                distance: Number(result.distance) || 0,
                valid: result.valid === true,
                addressValidated: result.addressValidated === true,
              });
            } catch (error) {
              console.error(error);
              setDeliveryInfo(null);
              trackError("routing_unavailable");
              setDeliveryError(getFriendlyStorefrontError("delivery"));
            } finally {
              setCalculatingFee(false);
            }
          };'''

          storefront_pattern = re.compile(
              r'  const calculateDeliveryForAddress = async \(addressData: typeof EMPTY_ADDRESS\) => \{.*?^  \};\n\n  const handleBlurCep',
              re.MULTILINE | re.DOTALL,
          )
          storefront, replacements = storefront_pattern.subn(
              delivery_function + '\n\n  const handleBlurCep',
              storefront,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(f"Não foi possível substituir o cálculo do checkout: {replacements}")
          storefront_path.write_text(storefront)

          order_path = Path("src/app/api/orders/route.ts")
          order = order_path.read_text()
          order = order.replace(
              'import { calculateDeliveryFee, calculateDistance, getCoordinates } from "@/lib/geo";\n',
              'import { calculateDeliveryQuote, DeliveryQuoteError } from "@/lib/delivery-quote";\n',
              1,
          )

          order_block = '''    let deliveryFee = 0;
            let deliveryTime = 0;
            let deliveryDistance: number | null = null;

            if (fulfillmentType === "delivery") {
              try {
                const quote = await calculateDeliveryQuote(restaurant, address);
                deliveryFee = quote.price;
                deliveryTime = quote.time;
                deliveryDistance = quote.distance;
              } catch (error) {
                if (error instanceof DeliveryQuoteError) {
                  return NextResponse.json(
                    {
                      code: error.code,
                      error: error.message,
                      ...(error.details || {}),
                    },
                    { status: error.status },
                  );
                }
                throw error;
              }
            }'''

          order_pattern = re.compile(
              r'    let deliveryFee = 0;.*?\n\n    const total =',
              re.MULTILINE | re.DOTALL,
          )
          order, replacements = order_pattern.subn(
              order_block + '\n\n    const total =',
              order,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(f"Não foi possível substituir o cálculo do pedido: {replacements}")
          if '"straight_line"' not in order:
              raise SystemExit('Método straight_line não encontrado para substituição')
          order = order.replace('"straight_line"', '"road_route"', 1)
          order_path.write_text(order)

          replace_once(
              "src/features/storefront/DeliveryCalculator.tsx",
              "A distância é aproximada e calculada em linha reta entre a loja e o endereço informado.",
              "A distância é calculada pelo trajeto viário entre a loja e o endereço informado.",
          )
          PY

          rm .github/workflows/apply-road-distance.yml

          git config user.name "Gestor Delivery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/[slug]/page.tsx src/app/api/orders/route.ts src/features/storefront/DeliveryCalculator.tsx .github/workflows/apply-road-distance.yml
          git commit -m "feat(delivery): usa distância real por rota"
          git push origin HEAD:main
