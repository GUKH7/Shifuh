name: Apply iFood fallback from main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ORDER_TRACKING_SECRET: ci-placeholder-order-tracking-secret-with-32-characters
      WHATSAPP_BOT_API_URL: http://127.0.0.1:3001
      WHATSAPP_BOT_API_TOKEN: ci-placeholder-token

    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/ifood-public-link-fallback
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply fallback changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('src/app/api/integrations/ifood/public-link/import/route.ts')
          source = route.read_text(encoding='utf-8')

          source = source.replace(
              '  fetchIfoodPublicStoreData,\n  hydrateIfoodPublicMenuAddons,',
              '  extractMerchantUuidFromIfoodUrl,\n  fetchIfoodPublicStoreData,\n  hydrateIfoodPublicMenuAddons,',
              1,
          )

          old = '''    const admin = createAdminClient();
              const imported = await fetchIfoodPublicStoreData(publicUrl);
              let importedMenuSections = imported.menuSections;

              if (importedMenuSections.length === 0) {
                try {
                  importedMenuSections = await scrapeIfoodPublicMenu(publicUrl, {
                    street: imported.address.street,
                    number: imported.address.number,
                    neighborhood: imported.address.neighborhood,
                    city: imported.address.city,
                    state: imported.address.state,
                  });
                } catch (error) {
                  console.error("Fallback headless do iFood falhou:", error);
                }
              }
          '''

          old = old.replace('              ', '')

          new = '''    const admin = createAdminClient();
              const normalizedPublicUrl = new URL(publicUrl);
              normalizedPublicUrl.search = "";
              normalizedPublicUrl.hash = "";
              const canonicalPublicUrl = normalizedPublicUrl.toString();

              let imported: Awaited<ReturnType<typeof fetchIfoodPublicStoreData>>;

              try {
                imported = await fetchIfoodPublicStoreData(canonicalPublicUrl);
              } catch (pageError) {
                const merchantUuid = extractMerchantUuidFromIfoodUrl(canonicalPublicUrl);
                if (!merchantUuid) throw pageError;

                console.warn("Página pública do iFood bloqueada; tentando catálogo/navegador:", pageError);
                const fallbackSections = await scrapeIfoodPublicMenu(canonicalPublicUrl);

                imported = {
                  sourceUrl: canonicalPublicUrl,
                  merchantUuid,
                  slug: null,
                  shortId: null,
                  name: ownedRestaurant.name || null,
                  description: null,
                  phone: null,
                  coverUrl: null,
                  logoUrl: null,
                  address: {
                    street: ownedRestaurant.address_street || null,
                    number: ownedRestaurant.address_number || null,
                    neighborhood: ownedRestaurant.address_neighborhood || null,
                    city: ownedRestaurant.address_city || null,
                    state: ownedRestaurant.address_state || null,
                    zip: ownedRestaurant.address_zip || null,
                  },
                  location: {
                    latitude: ownedRestaurant.latitude ?? null,
                    longitude: ownedRestaurant.longitude ?? null,
                  },
                  menuSections: fallbackSections,
                };
              }

              let importedMenuSections = imported.menuSections;

              if (importedMenuSections.length === 0) {
                try {
                  importedMenuSections = await scrapeIfoodPublicMenu(canonicalPublicUrl, {
                    street: imported.address.street,
                    number: imported.address.number,
                    neighborhood: imported.address.neighborhood,
                    city: imported.address.city,
                    state: imported.address.state,
                  });
                } catch (error) {
                  console.error("Fallback headless do iFood falhou:", error);
                }
              }

              if (importedMenuSections.length === 0) {
                throw new Error(
                  "O iFood bloqueou a leitura automática ou não disponibilizou itens públicos para essa loja. Tente novamente em alguns minutos ou use a integração oficial do iFood.",
                );
              }
          '''

          new = new.replace('              ', '')

          if old not in source:
              raise SystemExit('Bloco alvo da rota não encontrado')
          source = source.replace(old, new, 1)
          route.write_text(source, encoding='utf-8')

          test = Path('tests/ifood-public-link-fallback.test.js')
          test.write_text('''const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");

          const route = fs.readFileSync(
            "src/app/api/integrations/ifood/public-link/import/route.ts",
            "utf8",
          );

          test("importação por link usa fallback quando a página pública é bloqueada", () => {
            assert.match(route, /catch \\(pageError\\)/);
            assert.match(route, /scrapeIfoodPublicMenu\\(canonicalPublicUrl\\)/);
            assert.match(route, /normalizedPublicUrl\\.search = ""/);
            assert.doesNotMatch(
              route,
              /const imported = await fetchIfoodPublicStoreData\\(publicUrl\\)/,
            );
          });
          '''.replace('          ', ''), encoding='utf-8')
          PY

      - name: Remove branch-only temporary workflow
        run: rm -f .github/workflows/apply-ifood-public-link-fix.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate definitive code
        run: npm run validate

      - name: Commit correction branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/integrations/ifood/public-link/import/route.ts tests/ifood-public-link-fallback.test.js .github/workflows/apply-ifood-public-link-fix.yml
          git commit -m "fix: usar fallback quando o iFood bloquear a página pública"
          git push origin HEAD:fix/ifood-public-link-fallback

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          git fetch origin main
          git switch --force-create main origin/main
          rm .github/workflows/apply-ifood-fallback-from-main.yml
          git add .github/workflows/apply-ifood-fallback-from-main.yml
          git commit -m "chore: remover automação temporária do iFood"
          git push origin main
